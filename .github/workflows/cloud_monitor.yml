name: 24/7 Cloud Security & Health Monitor

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: 'cloud-security-monitor'
  cancel-in-progress: false

jobs:
  cloud_security_audit:
    name: Cloud Security & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Cloud Security & Health Check
        run: node scripts/cloud_security_check.js

      - name: Generate Summary in GitHub Actions
        if: always()
        run: |
          echo "### 🛡️ Hostal Somnis - Informe de Vigilància 24/7" >> $GITHUB_STEP_SUMMARY
          echo "Data d'execució: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Web: [https://workspacenil.github.io/hostalsomnis/](https://workspacenil.github.io/hostalsomnis/)" >> $GITHUB_STEP_SUMMARY
          echo "- Supabase: Connectat i actiu" >> $GITHUB_STEP_SUMMARY
          echo "- 6 Habitacions reals (101, 102, 201, 202, 301, 302)" >> $GITHUB_STEP_SUMMARY

      - name: Alert via GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 ALERTA: Incidència detectada pel Vigilant al Núvol - Hostal Somnis (@workspacenil / nilrodergas00@gmail.com)',
              body: 'El vigilant 24/7 ha detectat una anomalia a la web o a la base de dades d\'Hostal Somnis.\n\n👤 Atenció responsable: @workspacenil\n📧 Correu de contacte: nilrodergas00@gmail.com\n📱 Canal d\'emergència: WhatsApp (+34633431945)\n\nS\'ha generat aquest avís automàtic per notificar de forma immediata al responsable.\n\nRevisa el registre detallat de l\'execució a GitHub Actions.',
              labels: ['security-alert']
            });
